<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0f172a"/>
  <!-- film strip left -->
  <rect x="4" y="10" width="3" height="12" rx="1" fill="#f59e0b"/>
  <rect x="4" y="10" width="3" height="2.5" rx="0.5" fill="#0f172a" opacity=".5"/>
  <rect x="4" y="14.5" width="3" height="2.5" rx="0.5" fill="#0f172a" opacity=".5"/>
  <rect x="4" y="19" width="3" height="2.5" rx="0.5" fill="#0f172a" opacity=".5"/>
  <!-- film strip right -->
  <rect x="25" y="10" width="3" height="12" rx="1" fill="#f59e0b"/>
  <rect x="25" y="10" width="3" height="2.5" rx="0.5" fill="#0f172a" opacity=".5"/>
  <rect x="25" y="14.5" width="3" height="2.5" rx="0.5" fill="#0f172a" opacity=".5"/>
  <rect x="25" y="19" width="3" height="2.5" rx="0.5" fill="#0f172a" opacity=".5"/>
  <!-- screen / play area -->
  <rect x="9" y="10" width="14" height="12" rx="2" fill="#f59e0b" opacity=".15"/>
  <!-- play triangle -->
  <polygon points="13,13 13,19 20,16" fill="#f59e0b"/>
</svg>
