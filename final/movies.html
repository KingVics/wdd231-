  <link rel="stylesheet" href="styles/header.css">

<body class="page-body">

  <header class="site-header">
    <nav class="nav container" aria-label="Main navigation">
      <a href="index.html" class="nav-logo">
        🎬 <span>Movie</span>Discovery Hub
      </a>

      <button class="hamburger" aria-expanded="false" aria-controls="nav-links" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>

      <ul class="nav-links" id="nav-links">
        <li><a href="index.html"     class="nav-link">Home</a></li>

      <h1>All Movies</h1>
      <p>Search, filter by genre, and save your favourites.</p>
    </div>
  </section>

  <main>
    <section class="section">
      <div class="container">

        <div class="search-bar">
          <input
            type="search"
            id="search-input"
            class="search-input"
            placeholder="Search movies…"
            aria-label="Search movies"
          >
        </div>

        <div class="filter-bar" id="filter-bar" role="group" aria-label="Filter by genre"></div>

        <!-- #374151 on white = 9.3:1, passes AAA -->
        <p style="margin-bottom:1rem; color:#374151; font-size:0.9rem;">
          Showing <strong id="movies-count">…</strong>
        </p>

        <div class="movies-grid" id="movies-grid">
          <p class="state-message">Loading movies…</p>
        </div>

      </div>
    </section>
